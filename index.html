function beep(q=500,d=.05){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=q;v.gain.value=.025;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function ui(){$('#st').textContent=stage;$('#sc').textContent=score;$('#lf').textContent=life;$('#sp').textContent=Math.floor(gauge)+'%';$('#mi').style.width=Math.min(100,gauge)+'%';$('#stage').textContent='STAGE '+stage+' — '+names[stage-1];$('#super').disabled=gauge<100}
function paw(a,b,s=13){x.fillStyle='#ffd9eb';x.beginPath();x.ellipse(a,b+2,s*.36,s*.29,0,0,7);x.fill();for(let q of[[-.30,-.22],[-.10,-.36],[.12,-.36],[.32,-.20]]){x.beginPath();x.arc(a+q[0]*s,b+q[1]*s,s*.11,0,7);x.fill()}}
function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2}
function reset(){f=sf=score=gauge=beam=inv=0;stage=1;boss=null;shots=[];enemies=[];drops=[];p.x=105;p.y=215;life=diff==='easy'?5:4;ui()}
function spawn(){let hard=diff==='hard'?1.25:1,e={x:760,y:45+Math.random()*340,w:42,h:42,v:(2+stage*.42)*hard,hp:stage===1?1:2,t:Math.random()<.52?'🍪':stage===2?'🦴':'👾'};enemies.push(e)}
function hurt(){if(inv||beam)return;life--;inv=70;beep(150,.12);if(life<=0)finish(false)}
function next(){if(stage<3){stage++;sf=0;enemies=[];shots=[];life=Math.min(5,life+1);gauge=Math.min(100,gauge+25);beep(800,.12)}else boss={x:800,y:215,w:150,h:120,hp:diff==='easy'?45:diff==='hard'?85:65,max:diff==='easy'?45:diff==='hard'?85:65,vy:1.6}}
function update(){f++;if(inv)inv--;sf++;for(let s of stars){s[0]-=1.1+stage*.25;if(s[0]<0)s[0]=W}let spd=5;if(key.u)p.y-=spd;if(key.d)p.y+=spd;if(key.l)p.x-=spd;if(key.r)p.x+=spd;p.x=Math.max(45,Math.min(320,p.x));p.y=Math.max(38,Math.min(392,p.y));if(f%9===0)shots.push({x:p.x+45,y:p.y-9,w:10,h:10},{x:p.x+45,y:p.y+9,w:10,h:10});if(!boss&&f%(diff==='hard'?32:40)===0)spawn();let dur=diff==='easy'?850:diff==='hard'?1150:1000;if(!boss&&sf>dur)next();for(let s of shots)s.x+=9;for(let e of enemies)e.x-=e.v;if(beam){beam--;for(let i=enemies.length-1;i>=0;i--)if(Math.abs(enemies[i].y-p.y)<78){enemies.splice(i,1);score+=120}if(boss&&Math.abs(boss.y-p.y)<105)boss.hp-=1.3}
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],dead=false;for(let j=shots.length-1;j>=0;j--)if(hit(e,shots[j])){shots.splice(j,1);if(--e.hp<=0){if(Math.random()<.15)drops.push({x:e.x,y:e.y,w:25,h:25,t:Math.random()<.65?'🪙':'🍖'});enemies.splice(i,1);score+=100+stage*20;gauge=Math.min(100,gauge+7);beep(720,.025);dead=true}break}if(dead)continue;if(hit(e,p)){enemies.splice(i,1);hurt()}else if(e.x<-55)enemies.splice(i,1)}
for(let d of drops)d.x-=2.2;for(let i=drops.length-1;i>=0;i--){let d=drops[i];if(hit(d,p)){if(d.t==='🍖')life=Math.min(5,life+1);else score+=250;drops.splice(i,1);beep(980,.05)}else if(d.x<0)drops.splice(i,1)}
if(boss){boss.x=Math.max(W-105,boss.x-2);boss.y+=boss.vy;if(boss.y<85||boss.y>345)boss.vy*=-1;for(let j=shots.length-1;j>=0;j--)if(hit(boss,shots[j])){shots.splice(j,1);boss.hp--;gauge=Math.min(100,gauge+1)}if(boss.hp<=0)finish(true)}shots=shots.filter(s=>s.x<750);ui()}
function draw(){let gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,stage===1?'#08132d':stage===2?'#11172c':'#1c0c35');gr.addColorStop(1,'#05060f');x.fillStyle=gr;x.fillRect(0,0,W,H);x.fillStyle='#fff';for(let s of stars)x.fillRect(s[0],s[1],s[2],s[2]);if(stage===1){x.fillStyle='#172037';for(let i=0;i<13;i++)x.fillRect(i*64-(f%64),345-(i%3)*22,49,85+(i%3)*22)}if(stage===2){x.fillStyle='#c5c7d1';x.beginPath();x.arc(630,80,53,0,7);x.fill();x.fillStyle='#777b88';for(let i=0;i<7;i++){x.beginPath();x.arc(600+Math.random()*60,55+Math.random()*55,5+Math.random()*8,0,7);x.fill()}}
for(let s of shots)paw(s.x,s.y,12);x.font='34px system-ui';x.textAlign='center';for(let e of enemies)x.fillText(e.t,e.x,e.y+10);for(let d of drops)x.fillText(d.t,d.x,d.y+8);if(boss){x.font='72px system-ui';x.fillText('😼',boss.x,boss.y+22);x.fillStyle='#ffffff30';x.fillRect(470,18,210,8);x.fillStyle='#ff64ba';x.fillRect(470,18,210*boss.hp/boss.max,8)}if(beam){x.fillStyle='#ffd3e7a0';x.fillRect(p.x+42,p.y-58,W-p.x,116);for(let a=p.x+105;a<W;a+=92)paw(a,p.y,25)}
x.save();x.translate(p.x,p.y);if(inv&&Math.floor(inv/5)%2===0)x.globalAlpha=.3;x.fillStyle='#ffb6dd';x.beginPath();x.ellipse(0,0,48,27,0,0,7);x.fill();x.fillStyle='#ffe9d0';x.beginPath();x.arc(5,0,21,0,7);x.fill();x.beginPath();x.moveTo(-8,-12);x.lineTo(-19,-31);x.lineTo(1,-18);x.fill();x.beginPath();x.moveTo(18,-12);x.lineTo(29,-31);x.lineTo(10,-18);x.fill();x.fillStyle='#2d2630';x.beginPath();x.arc(-2,-4,2.6,0,7);x.arc(12,-4,2.6,0,7);x.arc(5,4,3.2,0,7);x.fill();x.fillStyle='#ff6eaa';x.beginPath();x.ellipse(5,11,4.5,5.5,0,0,7);x.fill();paw(36,0,13);x.restore()}
function loop(){if(!running)return;if(!paused)update();draw();requestAnimationFrame(loop)}
function startGame(){reset();title.style.display='none';game.classList.add('on');$('#end').classList.remove('on');running=true;paused=false;beep(700,.1);loop()}
function finish(win){running=false;$('#end').classList.add('on');$('#et').textContent=win?'HICHEW WINS!! 🐶👑':'GAME OVER 🐾';$('#em').innerHTML=win?'宇宙のおやつを守った！<br>SCORE '+score:'STAGE '+stage+' / SCORE '+score}
$('#start').onclick=startGame;$('#set').onclick=()=>$('#settings').classList.add('on');$('#how').onclick=()=>$('#help').classList.add('on');$('#snd').onclick=()=>{sound=!sound;beep(650,.06)};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('on'));document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{diff=b.dataset.d;$('#settings').classList.remove('on')});$('#retry').onclick=startGame;$('#home').onclick=()=>{running=false;game.classList.remove('on');title.style.display='flex'};$('#pause').onclick=()=>paused=!paused;$('#super').onclick=()=>{if(gauge>=100){gauge=0;beam=65;beep(260,.3)}};
for(let [id,k] of[['up','u'],['down','d'],['left','l'],['right','r']]){let b=$('#'+id),on=e=>{e.preventDefault();key[k]=1},off=e=>{e.preventDefault();key[k]=0};b.onpointerdown=on;b.onpointerup=off;b.onpointercancel=off;b.onpointerleave=off}draw();ui()})();
</script></body></html>
